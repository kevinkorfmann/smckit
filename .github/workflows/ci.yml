name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/unit -m "unit and not slow"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra docs
      - name: Check formatting of production-contract files
        run: |
          uv run ruff format --check \
            src/smckit/_capabilities.py \
            src/smckit/_provenance.py \
            src/smckit/cli.py \
            src/smckit/io/_dical2.py \
            src/smckit/pp/_multihetsep.py \
            src/smckit/tl/_dical2.py \
            src/smckit/tl/_phlash.py \
            src/smckit/upstream/_run.py \
            tests/integration/test_dical2_vcf_semantics_oracle.py \
            tests/integration/test_multihetsep_preprocessing_oracle.py \
            tests/unit/test_empirical_manifest.py \
            tests/unit/test_multihetsep_preprocessing.py \
            scripts/build_dical2_repaired_oracle.py \
            scripts/benchmark_psmcplus_warm_core.py \
            scripts/aggregate_psmcplus_benchmark.py \
            scripts/aggregate_psmcplus_promotion.py \
            scripts/benchmark_psmcplus_native.py \
            scripts/verify_upstreams.py \
            workflow/publication/scripts/aggregate_results.py \
            workflow/publication/scripts/aggregate_phlash_validation.py \
            workflow/publication/scripts/benchmark_smcpp_split.py \
            workflow/publication/scripts/freeze_protocol.py \
            workflow/publication/scripts/plot_architecture.py \
            workflow/publication/scripts/plot_figure1.py \
            workflow/publication/scripts/run_benchmark.py \
            workflow/publication/scripts/run_phlash_accuracy.py \
            workflow/publication/scripts/validate_empirical_manifest.py \
            workflow/publication/scripts/validate_psmcplus_matrix.py
          uv run ruff check \
            src/smckit/_capabilities.py \
            src/smckit/_provenance.py \
            src/smckit/cli.py \
            src/smckit/io/_dical2.py \
            src/smckit/pp/_multihetsep.py \
            src/smckit/tl/_dical2.py \
            src/smckit/tl/_phlash.py \
            src/smckit/upstream/_run.py \
            tests/integration/test_dical2_vcf_semantics_oracle.py \
            tests/integration/test_multihetsep_preprocessing_oracle.py \
            tests/unit/test_empirical_manifest.py \
            tests/unit/test_multihetsep_preprocessing.py \
            scripts/build_dical2_repaired_oracle.py \
            scripts/benchmark_psmcplus_warm_core.py \
            scripts/aggregate_psmcplus_benchmark.py \
            scripts/aggregate_psmcplus_promotion.py \
            scripts/benchmark_psmcplus_native.py \
            scripts/verify_upstreams.py \
            workflow/publication/scripts/aggregate_results.py \
            workflow/publication/scripts/aggregate_phlash_validation.py \
            workflow/publication/scripts/benchmark_smcpp_split.py \
            workflow/publication/scripts/freeze_protocol.py \
            workflow/publication/scripts/plot_architecture.py \
            workflow/publication/scripts/plot_figure1.py \
            workflow/publication/scripts/run_benchmark.py \
            workflow/publication/scripts/run_phlash_accuracy.py \
            workflow/publication/scripts/validate_empirical_manifest.py \
            workflow/publication/scripts/validate_psmcplus_matrix.py
      - name: Validate workflow contracts
        run: |
          bash -n \
            workflow/slurm/smcpp-validation.sbatch \
            workflow/slurm/smcpp-promotion-benchmark.sbatch
          uv run python -m json.tool docs/parity/feature-ledger.json > /dev/null
          uv run python -m json.tool docs/parity/dical2-feature-ledger.json > /dev/null
          uv run python -m json.tool docs/parity/oracle-specifications.json > /dev/null
          uv run python -m json.tool preservation/upstreams.json > /dev/null
          uv run python scripts/verify_upstreams.py
          uv run python workflow/publication/scripts/validate_empirical_manifest.py \
            workflow/publication/empirical/1000genomes-na12878-grch38.json \
            > /dev/null
      - name: Resolve the frozen PHLASH publication DAG
        run: |
          cd workflow/publication
          uv run --project ../.. --extra dev --extra docs --extra publication \
            snakemake --dry-run --cores 1 results/phlash/summary.json > /dev/null
      - name: Rebuild deterministic diCal2 repaired oracle
        run: |
          repair_dir="$(mktemp -d)"
          uv run python scripts/build_dical2_repaired_oracle.py \
            --output "$repair_dir/dical2-marginal-kl-oracle.jar" \
            > "$repair_dir/metadata.json"
          uv run python -m json.tool "$repair_dir/metadata.json" > /dev/null
      - name: Run direct immutable-Java diCal2 VCF reader oracle
        run: uv run pytest -q tests/integration/test_dical2_vcf_semantics_oracle.py
      - name: Run pinned msmc-tools multihetsep oracle
        run: |
          oracle_path="$RUNNER_TEMP/generate_multihetsep-4d1f05f.py"
          curl --fail --location --silent --show-error \
            --output "$oracle_path" \
            https://raw.githubusercontent.com/stschiff/msmc-tools/4d1f05f39f7b4f8c205e602c180b44a7c68a7bba/generate_multihetsep.py
          echo "caaa87a07e0fe2dc7228f30c9aff759cf86e9f61b8332aabd41398399ea6331b  $oracle_path" \
            | sha256sum --check
          SMCKIT_MSMC_TOOLS_GENERATE="$oracle_path" \
            uv run pytest -q tests/integration/test_multihetsep_preprocessing_oracle.py
      - run: uv run python -m build
      - run: uv run pytest -q tests/integration/test_build_install_smoke.py
      - run: uv run sphinx-build -W -b html docs docs/_build/html
